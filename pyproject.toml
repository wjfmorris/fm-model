[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fm-model"
version = "0.3.0"
description = "League targets, learned goal drivers and squad recruitment models for Football Manager"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "scipy>=1.11,<2",
    "scikit-learn>=1.4,<2",
]

[project.optional-dependencies]
imports = [
    "openpyxl>=3.1",
    "lxml>=5",
]
app = [
    "streamlit==1.63.0",
    "plotly>=5.24,<7",
    "openpyxl>=3.1",
    "lxml>=5",
]
dev = [
    "ruff>=0.9",
]

[project.scripts]
fm-model = "fm_model.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"
